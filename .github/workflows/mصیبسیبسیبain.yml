name: Build IranianVRStreamer Android Client

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # تنظیم مسیر کاری برای تمام مراحل (Steps)
    defaults:
      run:
        working-directory: IranianVRStreamer_Quest_Client_V2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

