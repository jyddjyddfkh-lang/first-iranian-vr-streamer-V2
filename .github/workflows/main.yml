name: Build IranianVRStreamer Android Client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # دادن مجوز اجرای gradlew (بسیار مهم برای محیط لینوکسی گیت‌هاب)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # بیلد کردن پروژه
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # آپلود فایل خروجی برای دانلود
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
