name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate and Run Gradle
        run: |
          echo "Looking for gradlew file..."
          # پیدا کردن محل دقیق فایل gradlew
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLE_PATH" ]; then
            echo "::error:: File 'gradlew' not found in this repository!"
            # نمایش لیست فایل‌ها برای عیب‌یابی
            find . -maxdepth 3
            exit 1
          fi
          
          echo "Found gradlew at: $GRADLE_PATH"
          chmod +x "$GRADLE_PATH"
          
          # رفتن به پوشه‌ای که فایل در آن است و اجرای بیلد
          cd "$(dirname "$GRADLE_PATH")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestClient-Debug
          path: "**/app/build/outputs/apk/debug/*.apk"
