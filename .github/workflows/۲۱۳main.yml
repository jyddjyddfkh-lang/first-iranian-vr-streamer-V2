name: Build IranianVRStreamer Android Client

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # اگر باز هم خطای gradlew داد، یعنی مسیر پروژه در گیت‌هاب شما متفاوت است
        # اما فعلا فرض می‌کنیم فایل‌ها در ریشه هستند
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IranianVRStreamer-APK
          path: app/build/outputs/apk/debug/*.apk
