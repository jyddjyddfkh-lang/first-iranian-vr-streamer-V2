name: Android Build (Corrected)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # این اکشن دقیقاً مشکل نبودِ دستور gradle را حل می‌کند
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        working-directory: IranianVRStreamer_Quest_Client_V2
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestClient-Debug
          path: IranianVRStreamer_Quest_Client_V2/app/build/outputs/apk/debug/*.apk
