name: Android Build (Fixed)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle Wrapper (Manual Injection)
        working-directory: IranianVRStreamer_Quest_Client_V2
        run: |
          # چون فایل gradlew در مخزن شما نیست، ما از دستور gradle سیستم استفاده می‌کنیم
          # یا اگر می‌خواهید از wrapper استفاده کنید، ابتدا آن را تولید می‌کنیم
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestClient-Debug
          path: IranianVRStreamer_Quest_Client_V2/app/build/outputs/apk/debug/*.apk
