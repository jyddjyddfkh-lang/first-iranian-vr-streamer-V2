name: Android Build (Smart Search)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug - List All Files
        run: |
          echo "--- LISTING FILES TO FIND PROJECT ---"
          ls -R
          echo "--------------------------------------"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Project
        run: |
          # ۱. پیدا کردن پوشه‌ای که فایل build.gradle در آن است
          PROJECT_DIR=$(find . -name "build.gradle" -not -path "*/app/*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: Could not find a directory containing build.gradle"
            exit 1
          fi
          
          echo "Found project directory at: $PROJECT_DIR"
          
          # ۲. رفتن به آن پوشه و اجرای بیلد
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestClient-Debug
          path: "**/app/build/outputs/apk/debug/*.apk"
