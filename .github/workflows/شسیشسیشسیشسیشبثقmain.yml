name: Android Build (Final Fix)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # این مرحله بسیار مهم است؛ چون فایل gradlew شما وجود ندارد، 
      # این اکشن ابزار gradle را به صورت خودکار نصب و آماده می‌کند.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: IranianVRStreamer_Quest_Client_V2
        run: |
          # ما از دستور 'gradle' استفاده می‌کنیم نه './gradlew'
          # چون فایل gradlew در مخزن شما وجود ندارد.
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestClient-Debug
          path: IranianVRStreamer_Quest_Client_V2/app/build/outputs/apk/debug/*.apk
