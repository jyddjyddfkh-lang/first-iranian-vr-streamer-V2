name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Project
        # ما دقیقاً می‌گوییم به کدام پوشه برویم
        working-directory: IranianVRStreamer_Quest_Client_V2
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestClient-Debug
          # مسیر را از ریشه پروژه جستجو می‌کنیم تا خطا ندهد
          path: "**/app/build/outputs/apk/debug/*.apk"
